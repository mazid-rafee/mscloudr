[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mscloudr"
version = "0.1.0"
description = "Reproducible research code for multimodal cloud removal on SEN12MS-CR"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24",
    "torch>=2.1",
]

[project.optional-dependencies]
data = [
    "rasterio>=1.3",
]
dev = [
    "pytest>=8.0",
    "rasterio>=1.3",
]

[project.scripts]
mscloudr-audit-dataset = "mscloudr.cli.audit_dataset:main"\nmscloudr-audit-split = "mscloudr.cli.audit_split:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
